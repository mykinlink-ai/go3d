<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kinlink crest generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comfortaa', sans-serif;
      background: transparent;
      text-align: center;
      color: #d4af37;
    }
    canvas {
      background: transparent;
      margin-top: 20px;
    }
    select, input, button {
      font-family: 'Comfortaa', sans-serif;
      margin: 5px;
      padding: 8px;
      font-size: 16px;
    }
    button {
      background-color: #4b0082;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 style="text-transform: lowercase;">kinlink crest generator</h1>

  <input type="text" id="motto" value="E PLURIBUS UNUM" placeholder="Motto"><br>

  <select id="topLeft">
    <option>Tree</option>
    <option>DNA</option>
    <option>Book</option>
    <option>Tulip</option>
  </select>

  <select id="topRight">
    <option>DNA</option>
    <option>Tree</option>
    <option>Book</option>
    <option>Tulip</option>
  </select><br>

  <select id="bottomLeft">
    <option>Book</option>
    <option>Tree</option>
    <option>DNA</option>
    <option>Tulip</option>
  </select>

  <select id="bottomRight">
    <option>Tulip</option>
    <option>Tree</option>
    <option>DNA</option>
    <option>Book</option>
  </select><br>

  <button onclick="drawCrest()">Download Crest</button>

  <canvas id="crestCanvas" width="800" height="1000"></canvas>

  <script>
    const canvas = document.getElementById('crestCanvas');
    const ctx = canvas.getContext('2d');

    function drawMetalGradient(x0, y0, x1, y1) {
      const grad = ctx.createLinearGradient(x0, y0, x1, y1);
      grad.addColorStop(0, '#f5deb3'); // light gold
      grad.addColorStop(0.5, '#d4af37'); // gold
      grad.addColorStop(1, '#b8860b'); // dark gold
      return grad;
    }

    function drawSymbol(text, x, y) {
      ctx.font = '28px Comfortaa';
      ctx.fillStyle = drawMetalGradient(x - 50, y - 50, x + 50, y + 50);
      ctx.shadowColor = '#b8860b';
      ctx.shadowBlur = 8;
      ctx.textAlign = 'center';
      ctx.fillText(text, x, y);
      ctx.shadowBlur = 0;
    }

    function drawCrest() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Shield outline
      ctx.strokeStyle = drawMetalGradient(300, 200, 500, 600);
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(300, 200);
      ctx.lineTo(500, 200);
      ctx.lineTo(550, 600);
      ctx.lineTo(250, 600);
      ctx.closePath();
      ctx.stroke();

      // Cross divider
      ctx.beginPath();
      ctx.moveTo(400, 200);
      ctx.lineTo(400, 600);
      ctx.moveTo(300, 400);
      ctx.lineTo(500, 400);
      ctx.stroke();

      // Symbols
      drawSymbol(document.getElementById('topLeft').value, 350, 300);
      drawSymbol(document.getElementById('topRight').value, 450, 300);
      drawSymbol(document.getElementById('bottomLeft').value, 350, 500);
      drawSymbol(document.getElementById('bottomRight').value, 450, 500);

      // Crown
      ctx.font = '48px Comfortaa';
      ctx.fillStyle = drawMetalGradient(380, 150, 420, 180);
      ctx.fillText('👑', 400, 180);

      // Motto
      ctx.font = '24px Comfortaa';
      ctx.fillStyle = drawMetalGradient(300, 650, 500, 670);
      ctx.fillText(document.getElementById('motto').value, 400, 650);

      // kinlink
      ctx.font = '36px Comfortaa';
      ctx.fillStyle = drawMetalGradient(300, 700, 500, 720);
      ctx.fillText('kinlink', 400, 700);
    }

    drawCrest();
  </script>
</body>
</html>
