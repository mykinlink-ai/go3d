<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KinLink Crest Generator</title>

  <!-- Load Comfortaa font -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
    }

    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .controls {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 6px;
      margin-top: 4px;
      box-sizing: border-box;
    }

    .preview {
      width: 100%;
      text-align: center;
    }

    canvas {
      width: 100% !important;
      height: auto !important;
      border: 1px solid #ccc;
      background: #f7f7f7;
    }

    .download-btn {
      margin-top: 15px;
      padding: 10px 14px;
      background: #3a0a5a;
      color: #fff;
      border: none;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <h2>KinLink Crest Generator</h2>

  <div class="container">

    <div class="controls">
      <label for="color">Primary Color</label>
      <input type="color" id="color" value="#3a0a5a">

      <label for="motto">Motto</label>
      <input type="text" id="motto" value="E PLURIBUS UNUM">

      <label for="topLeft">Top Left Symbol</label>
      <select id="topLeft">
        <option value="Tree">Tree</option>
        <option value="Star">Star</option>
        <option value="Heart">Heart</option>
      </select>

      <label for="topRight">Top Right Symbol</label>
      <select id="topRight">
        <option value="DNA">DNA</option>
        <option value="Book">Book</option>
        <option value="Shield">Shield</option>
      </select>

      <label for="bottomLeft">Bottom Left Symbol</label>
      <select id="bottomLeft">
        <option value="Book">Book</option>
        <option value="Tulip">Tulip</option>
        <option value="Candle">Candle</option>
      </select>

      <label for="bottomRight">Bottom Right Symbol</label>
      <select id="bottomRight">
        <option value="Tulip">Tulip</option>
        <option value="Heart">Heart</option>
        <option value="Leaf">Leaf</option>
      </select>

      <button class="download-btn" id="downloadBtn">Download Crest</button>
    </div>

    <div class="preview">
      <canvas id="crestCanvas" width="800" height="1000"></canvas>
    </div>

  </div>

  <script>
    const canvas = document.getElementById('crestCanvas');
    const ctx = canvas.getContext('2d');

    const controls = {
      color: document.getElementById('color'),
      motto: document.getElementById('motto'),
      topLeft: document.getElementById('topLeft'),
      topRight: document.getElementById('topRight'),
      bottomLeft: document.getElementById('bottomLeft'),
      bottomRight: document.getElementById('bottomRight'),
      downloadBtn: document.getElementById('downloadBtn')
    };

    function drawCrest() {
      const primaryColor = controls.color.value;
      const motto = controls.motto.value.toUpperCase();
      const tl = controls.topLeft.value;
      const tr = controls.topRight.value;
      const bl = controls.bottomLeft.value;
      const br = controls.bottomRight.value;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Shield outline
      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(200, 150);
      ctx.lineTo(600, 150);
      ctx.lineTo(680, 400);
      ctx.lineTo(400, 850);
      ctx.lineTo(120, 400);
      ctx.closePath();
      ctx.stroke();

      // Shield fill
      ctx.fillStyle = '#f3ecff';
      ctx.fill();

      // Cross lines
      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(400, 150);
      ctx.lineTo(400, 850);
      ctx.moveTo(200, 400);
      ctx.lineTo(600, 400);
      ctx.stroke();

      // Helper to draw text in quadrant
      function drawSymbol(text, x, y) {
        ctx.fillStyle = primaryColor;
        ctx.font = '40px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(text, x, y);
      }

      drawSymbol(tl, 300, 300);
      drawSymbol(tr, 500, 300);
      drawSymbol(bl, 300, 600);
      drawSymbol(br, 500, 600);

      // Heart + Infinity
      ctx.fillStyle = primaryColor;
      ctx.font = '70px Arial';
      ctx.fillText('♥ ∞', 400, 500);

      // Crown
      ctx.font = '70px Arial';
      ctx.fillText('👑', 400, 120);

      // Motto
      ctx.font = '32px Arial';
      ctx.fillText(motto, 400, 930);

      // kinlink logo (Comfortaa + lowercase)
      ctx.fillStyle = '#3a0a5a';
      ctx.font = '48px Comfortaa';
      ctx.fillText('kinlink', 400, 980);
    }

    Object.values(controls).forEach(control => {
      if (control.tagName === 'INPUT' || control.tagName === 'SELECT') {
        control.addEventListener('input', drawCrest);
        control.addEventListener('change', drawCrest);
      }
    });

    controls.downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'kinlink-crest.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    drawCrest();
  </script>

</body>
</html>
