<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>kinlink crest generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comfortaa', sans-serif;
      background: transparent;
      text-align: center;
      color: #d4af37;
    }
    canvas {
      background: transparent;
      margin-top: 20px;
    }
    select, input, button {
      font-family: 'Comfortaa', sans-serif;
      margin: 5px;
      padding: 8px;
      font-size: 16px;
    }
    button {
      background-color: #4b0082;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1 style="text-transform: lowercase;">kinlink crest generator</h1>

  <input type="text" id="motto" value="E PLURIBUS UNUM" placeholder="Motto"><br>

  <select id="topLeft">
    <option>Tree</option>
    <option>DNA</option>
    <option>Book</option>
    <option>Tulip</option>
  </select>

  <select id="topRight">
    <option>DNA</option>
    <option>Tree</option>
    <option>Book</option>
    <option>Tulip</option>
  </select><br>

  <select id="bottomLeft">
    <option>Book</option>
    <option>Tree</option>
    <option>DNA</option>
    <option>Tulip</option>
  </select>

  <select id="bottomRight">
    <option>Tulip</option>
    <option>Tree</option>
    <option>DNA</option>
    <option>Book</option>
  </select><br>

  <button onclick="drawCrest()">Download Crest</button>

  <canvas id="crestCanvas" width="800" height="1000"></canvas>

  <script>
    const canvas = document.getElementById('crestCanvas');
    const ctx = canvas.getContext('2d');

    function drawCrest() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Metallic gradient
      const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
      gradient.addColorStop(0, '#d4af37');
      gradient.addColorStop(1, '#b8860b');
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 8;

      // Shield
      ctx.beginPath();
      ctx.moveTo(300, 200);
      ctx.lineTo(500, 200);
      ctx.lineTo(550, 600);
      ctx.lineTo(250, 600);
      ctx.closePath();
      ctx.stroke();

      // Cross divider
      ctx.beginPath();
      ctx.moveTo(400, 200);
      ctx.lineTo(400, 600);
      ctx.moveTo(300, 400);
      ctx.lineTo(500, 400);
      ctx.stroke();

      // Symbols
      ctx.font = '28px Comfortaa';
      ctx.fillStyle = '#d4af37';
      ctx.textAlign = 'center';
      ctx.fillText(document.getElementById('topLeft').value, 350, 300);
      ctx.fillText(document.getElementById('topRight').value, 450, 300);
      ctx.fillText(document.getElementById('bottomLeft').value, 350, 500);
      ctx.fillText(document.getElementById('bottomRight').value, 450, 500);

      // Crown
      ctx.font = '40px Comfortaa';
      ctx.fillText('👑', 400, 180);

      // Motto
      ctx.font = '24px Comfortaa';
      ctx.fillText(document.getElementById('motto').value, 400, 650);

      // kinlink
      ctx.font = '36px Comfortaa';
      ctx.fillText('kinlink', 400, 700);
    }

    drawCrest();
  </script>
</body>
</html>
